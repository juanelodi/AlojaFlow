name: Error
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Si tienes AlojaFlow instalado, «Reportar o sugerir» (menú de usuario) es más rápido: agrega sola la pantalla, la versión y el navegador.

        **Este issue es público.** No escribas datos de huéspedes, contraseñas ni claves. Un fallo de seguridad se avisa en privado: lee [SECURITY.md](https://github.com/juanelodi/AlojaFlow/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Versión de AlojaFlow
      placeholder: 1.0.45
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Cómo trabaja la propiedad
      options:
        - Independiente
        - Subordinada a HotelDruid
        - Subordinada a AlojaFlow 1.2.x
        - No lo sé
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Si salió un mensaje, cópialo tal cual.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Entra a…
        2. Haz clic en…
        3. Sale…
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
  - type: input
    id: servidor
    attributes:
      label: Servidor
      description: Versión de PHP, MySQL o MariaDB y tipo de hosting (compartido, VPS…), si lo sabes.
  - type: textarea
    id: registro
    attributes:
      label: Registro de errores
      description: Lo que corresponda de `storage/logs/laravel.log`, si tienes acceso. Revisa antes que no lleve datos personales.
      render: text
  - type: checkboxes
    id: datos
    attributes:
      label: Datos personales
      options:
        - label: No incluí datos de huéspedes, contraseñas ni claves.
          required: true
