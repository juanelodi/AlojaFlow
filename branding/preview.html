<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlojaFlow logos</title>
<style>body{font-family:'Segoe UI',Arial,sans-serif;margin:24px;background:#f6f7f8;color:#0B1F2A}h1{font-size:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}button{padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#0B1F2A;color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.c{background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0}.c.dark{background:#0B1F2A}.c small{display:block;margin-top:10px;color:#64748b}svg{width:100%;height:auto;max-height:90px}</style>
<h1>AlojaFlow — propuestas de logo</h1><div class="bar" id="bar"></div><div class="g" id="g">
<div class="c"><div class="s"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" role="img" aria-label="AlojaFlow"><g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 33 L30 13 L52 33" stroke="#0F766E"/><path d="M8 46 Q19 37 30 46 T52 46" stroke="#F59E0B"/></g><text x="66" y="42" font-family="Poppins,'Segoe UI',Arial,sans-serif" font-size="28" fill="#0B1F2A"><tspan font-weight="700">Aloja</tspan><tspan font-weight="300" fill="#0F766E">Flow</tspan></text></svg></div><small>logo-a-techo-ola</small></div>
<div class="c"><div class="s"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" role="img" aria-label="AlojaFlow"><rect x="4" y="4" width="56" height="56" rx="14" fill="#0F766E"/><g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 46 L32 17 L47 46" stroke="#fff"/><path d="M22 39 Q27 33 32 39 T42 39" stroke="#F59E0B"/></g><text x="72" y="42" font-family="Poppins,'Segoe UI',Arial,sans-serif" font-size="28" fill="#0B1F2A"><tspan font-weight="700">Aloja</tspan><tspan font-weight="300" fill="#0F766E">Flow</tspan></text></svg></div><small>logo-b-a-flow</small></div>
<div class="c"><div class="s"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" role="img" aria-label="AlojaFlow"><path d="M32 6 L56 26 V52 a6 6 0 0 1 -6 6 H14 a6 6 0 0 1 -6 -6 V26 Z" fill="#0F766E" stroke="#0F766E" stroke-width="4" stroke-linejoin="round"/><path d="M17 40 Q24.5 32 32 40 T47 40" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/><text x="70" y="42" font-family="Poppins,'Segoe UI',Arial,sans-serif" font-size="28" fill="#0B1F2A"><tspan font-weight="700">Aloja</tspan><tspan font-weight="300" fill="#0F766E">Flow</tspan></text></svg></div><small>logo-c-casa-ola</small></div>
<div class="c"><div class="s"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" role="img" aria-label="AlojaFlow"><text x="4" y="43" font-family="Poppins,'Segoe UI',Arial,sans-serif" font-size="34" letter-spacing="-1" fill="#0B1F2A"><tspan font-weight="700">aloja</tspan><tspan font-weight="300" fill="#0F766E">flow</tspan><tspan font-weight="700" fill="#F59E0B">.</tspan></text></svg></div><small>logo-d-solo-texto</small></div>
</div><script>
const pal={"Teal + ámbar (recomendada)":["#0F766E","#F59E0B","#0B1F2A"],"Índigo + coral":["#3730A3","#F97316","#1E1B4B"],"Verde bosque + arena":["#166534","#D4A24C","#14231A"]};
const base=["#0F766E","#F59E0B","#0B1F2A"];const orig=[...document.querySelectorAll(".s")].map(e=>e.innerHTML);
function set(k){const p=pal[k];document.querySelectorAll(".s").forEach((e,i)=>{let h=orig[i];base.forEach((b,j)=>h=h.split(b).join("@@"+j));p.forEach((c,j)=>h=h.split("@@"+j).join(c));e.innerHTML=h});[...bar.children].forEach(b=>b.setAttribute("aria-pressed",b.textContent==k))}
for(const k in pal){const b=document.createElement("button");b.textContent=k;b.onclick=()=>set(k);bar.append(b)}set(Object.keys(pal)[0]);</script></html>
